# يجلب مكتبات نظام الفواتير (PDF والباركود) بإصدارات و SHA-256 مثبّتة، ويحفظها في invoice/vendor
name: Invoice vendor libraries
on:
  push:
    paths: ['scripts/fetch-invoice-vendor.mjs', '.github/workflows/invoice-vendor.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-invoice-vendor.mjs
      - name: Commit vendor files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add invoice/vendor
          git diff --cached --quiet || git commit -m "Invoice: add vendor libraries" && git push
